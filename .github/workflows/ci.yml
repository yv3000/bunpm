name: bunpm CI

# Quoted: YAML 1.1 parsers (PyYAML) read a bare `on` key as boolean true.
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      # Smoke tests run the installed launchers through Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      # Assert committed lockfiles are tracked in git repository.
      - name: Verify tracked lockfiles
        id: verify-tracked-lockfiles
        run: git ls-files --error-unmatch package-lock.json bun.lock
      # npm ci refuses a package-lock.json that is out of step with package.json.
      - name: Install dependencies from package-lock.json
        id: npm-ci
        run: npm ci --ignore-scripts
      - name: Build (node --check)
        id: npm-run-build
        run: npm run build
      - name: Run test suite (npm test)
        id: npm-test
        run: npm test
      # ESLint, tsc and Prettier do not depend on the OS, so they run once, here.
      - name: Run linter (npm run lint)
        id: npm-run-lint
        run: npm run lint
      - name: Run typecheck (npm run typecheck)
        id: npm-run-typecheck
        run: npm run typecheck
      - name: Format check (prettier)
        id: npm-run-format
        run: npm run format:check

  quality:
    needs: test-unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      # Assert committed bun.lock is tracked in git.
      - name: Verify tracked bun.lock
        id: verify-bun-lock
        run: git ls-files --error-unmatch bun.lock
      # --frozen-lockfile refuses a bun.lock that is out of step with package.json.
      - name: Install dependencies from bun.lock
        id: bun-install
        run: bun install --frozen-lockfile --ignore-scripts
      # Reporter flags must precede the glob; Node ignores them after it.
      - name: Run test suite with a JUnit report
        id: test
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit "--test-reporter-destination=${{ runner.temp }}/junit.xml" "tests/*.test.js"
      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: ${{ runner.temp }}/junit.xml
      # c8 exits non-zero when any .c8rc.json threshold is missed, failing the job.
      - name: Print coverage thresholds
        shell: bash
        run: |
          echo "Enforcing c8 thresholds from .c8rc.json: statements 95%, branches 90%, functions 90%, lines 90%"
      - name: Test with coverage (c8 node:test)
        id: coverage
        continue-on-error: false
        run: npm run test:coverage
      - name: Print coverage summary
        run: npx c8 report --reporter=text-summary
      # Only Windows runs wrapper.js's batch-shim branch, so only Windows can
      # hold every runtime file to the line minimum on its own. Branches are
      # gated overall: each OS takes only its own side of platform checks.
      - name: Per-file coverage (c8)
        if: runner.os == 'Windows'
        run: npx c8 check-coverage --per-file --branches 0
      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Coverage (${{ matrix.os }})"
            echo "Gate: statements 95%, branches 90%, functions 90%, lines 90%"
            echo '```'
            npx c8 report --reporter=text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/lcov.info
      - name: Run repeated test suite
        id: repeat
        run: npm run test:repeat
      # Fails on any high- or critical-severity advisory in either lockfile:
      # package-lock.json via npm, bun.lock via Bun. Advisories do not depend
      # on the OS.
      - name: Dependency audit (npm audit)
        id: audit
        if: runner.os == 'Linux'
        run: npm run audit
      - name: Generate dependency freshness report
        id: freshness
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          status=0
          npm outdated --json > "${{ runner.temp }}/dependency-freshness.json" || status=$?
          node scripts/check-freshness.js "${{ runner.temp }}/dependency-freshness.json" "$status"
      - name: Upload dependency freshness report
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-freshness
          path: ${{ runner.temp }}/dependency-freshness.json
      - name: Run cross-platform smoke tests
        id: smoke
        run: npm run smoke
      - name: Verify working tree clean
        run: git diff --check
      - name: Parse PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1', 'uninstall.ps1', 'path.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/bunpm/platforms/windows/scripts/$file", [ref]$tokens, [ref]$errors) > $null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Validate shell and workflow sources
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bun run shell:check
          for file in bunpm/platforms/{linux,macos}/{scripts/*.sh,bin/*}; do bash -n "$file"; done
          if ! command -v actionlint; then
            GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
            export PATH="$RUNNER_TEMP/bin:$PATH"
          fi
          actionlint
