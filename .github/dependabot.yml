# Weekly version updates. Dependabot opens ordinary pull requests that must pass
# the same required checks as any other change; nothing is merged automatically.
version: 2
updates:
  # Every dependency in package.json is a development dependency: bunpm ships
  # zero runtime dependencies.
  #
  # The bun updater natively parses package.json and modern text bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Etc/UTC
    commit-message:
      prefix: chore
      include: scope
    # @types/node stays on 16.x on purpose: `typecheck` uses it to reject
    # Node.js APIs newer than the Node 16.9 runtime floor (CONTRIBUTING.md).
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    # One pull request per week for all tooling instead of one per package.
    groups:
      dev-tooling:
        patterns:
          - '@types/node'
          - 'c8'
          - 'eslint'
          - 'prettier'
          - 'typescript'

  # Actions are pinned to full commit SHAs in .github/workflows/ci.yml, with the
  # release tag in a trailing comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Etc/UTC
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
