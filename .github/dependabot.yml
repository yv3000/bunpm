# Dependabot configuration
#
# Two ecosystems, both at the repo root:
#
#   bun            — package.json + bun.lock, which hold eslint and prettier.
#                    These are the project's only dependencies and they are
#                    dev-only.
#
#                    It must be `bun`, not `npm`. The npm updater edits
#                    package.json and a yarn/npm lockfile but does not know how
#                    to regenerate bun.lock, so every PR it opened left the
#                    lockfile stale and CI failed at
#                    `bun install --frozen-lockfile`. Dependabot's bun updater
#                    handles the text-based bun.lock (bun >= 1.1.39).
#
#                    bunpm/package.json is deliberately NOT listed: it has zero
#                    dependencies by design (see Hard rules in CONTRIBUTING.md),
#                    so an entry pointing at it would be dead config with
#                    nothing to ever update.
#
#   github-actions — the pinned action versions in .github/workflows/ci.yml
#                    (actions/checkout, actions/setup-node, oven-sh/setup-bun).
#                    These are real dependencies that go stale silently.
#
# commit-message.prefix keeps Dependabot's PRs inside the conventional commit
# format the rest of the history uses.
version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    ignore:
      # eslint 9 removed .eslintrc support in favour of flat config, so any
      # major bump lands a version that cannot read .eslintrc.json and the
      # "Run ESLint" step fails. Minor and patch updates still come through.
      #
      # This is a deliberate hold, not a fix. Migrating .eslintrc.json to
      # eslint.config.js would let eslint move forward again; until someone
      # does that, an eslint major PR can only ever be red.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
