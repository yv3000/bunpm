# Weekly version updates. Dependabot opens ordinary pull requests that must pass
# the same required checks as any other change; nothing is merged automatically.
version: 2
updates:
  # Every dependency in package.json is a development dependency: bunpm ships
  # zero runtime dependencies.
  #
  # The npm updater refreshes package.json and package-lock.json but cannot
  # update bun.lock. CI installs with both `npm ci` and
  # `bun install --frozen-lockfile`, so such a pull request fails until
  # `bun install --ignore-scripts` is run and bun.lock is committed with it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Etc/UTC
    commit-message:
      prefix: chore
      include: scope
    # @types/node stays on 16.x on purpose: `typecheck` uses it to reject
    # Node.js APIs newer than the Node 16.9 runtime floor (CONTRIBUTING.md).
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # One pull request per week for all tooling instead of one per package.
    groups:
      dev-tooling:
        patterns: ['*']

  # Actions are pinned to major tags in .github/workflows/ci.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Etc/UTC
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
